<div class="worker" id="worker"><div class="helmet"></div><div class="head"></div><div class="torso"></div></div>
<div class="hud" id="status">Listo para iniciar turno</div>
<button class="action" id="action" onclick="doAction()"></button></div>
<div class="controls"><div class="arrows"><button onclick="move(-1)">←</button><button onclick="move(1)">→</button></div><button id="start" onclick="startGame()">INICIAR TURNO</button></div>
<div class="note">Pulsa INICIAR TURNO. Después mantén pulsadas las flechas o tócalas repetidamente para caminar. Los botones amarillos ejecutan las acciones.</div>
</main>
<script>
var started=false,phase='idle',x=56,score=0,seconds=300,walking=null;
function say(t){document.getElementById('status').innerHTML=t;}
function paint(){var w=document.getElementById('worker');w.style.display=started?'block':'none';w.style.left=x+'%';}
function actionButton(label){var b=document.getElementById('action');b.innerHTML=label||'';b.style.display=label?'block':'none';}
function startGame(){started=true;phase='walkcut';x=56;paint();say('Turno iniciado. Camina hacia la zona de corte →');document.getElementById('start').innerHTML='TURNO EN CURSO';}
function move(d){
 if(!started){say('Primero pulsa INICIAR TURNO');return;}
 if(phase==='walkcut'&&d>0){x+=1.4;if(x>=67){x=67;phase='atcut';say('Llegaste a la zona de corte');actionButton('SUBIR BALCÓN');}}
 else if(phase==='walkbench'&&d>0){x+=1;if(x>=13){x=13;phase='measure';say('Frente al tubo del bancal verde');actionButton('MEDIR TUBO');}}
 else if(phase==='walkleft'&&d<0){x-=1.4;if(x<=7){x=7;phase='walkbench';say('Camina a la derecha hacia el centro del bancal');}}
 else if(phase==='return'&&d>0){x+=1.4;if(x>=56){x=56;phase='walkcut';say('Nuevo ciclo: camina hacia la zona de corte →');}}
 paint();
}
function doAction(){
 if(phase==='atcut'){phase='top';say('Subiendo por la escalera…');actionButton('');setTimeout(function(){phase='top';say('Estás arriba del balcón');actionButton('BAJAR A CORTE');},800);}
 else if(phase==='top'){phase='descend';say('Bajando por la escalera…');actionButton('');setTimeout(function(){phase='cut';say('En posición de corte');actionButton('CORTAR TUBO');},800);}
 else if(phase==='cut'){score+=25;document.getElementById('score').innerHTML=score;phase='up';say('Corte realizado +25. Sube al balcón');actionButton('SUBIR');}
 else if(phase==='up'){phase='top2';say('En la parte alta del balcón');actionButton('BAJAR DE BALCÓN');}
 else if(phase==='top2'){phase='walkleft';x=67;paint();say('Bajando al piso. Camina hacia la izquierda ←');actionButton('');}
 else if(phase==='measure'){score+=25;document.getElementById('score').innerHTML=score;phase='return';say('Medición completada +25. Regresa hacia la derecha →');actionButton('');}
}
setInterval(function(){if(started&&seconds>0){seconds--;document.getElementById('clock').innerHTML=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}},1000);
</script></body></html>
